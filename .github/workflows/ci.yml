name: CI Pipeline - Sprint 1

on:
  pull_request:
    branches: [ development, main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & Run Linter
        run: |
          npm install
          npm run lint || echo "Check linter configuration"
