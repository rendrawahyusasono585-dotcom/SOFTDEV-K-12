<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pentas – Tiket Acara</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef1f7;--sf:#fff;--tx:#18213f;--mu:#5d6684;--ln:#d6dbea;--pr:#2a3585;--pt:#fff;--ac:#f2b01e;--ok:#0f8b6d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121830;--sf:#1b2347;--tx:#eceffb;--mu:#a2abcc;--ln:#323c6b;--pr:#8f9cff;--pt:#121830;--ok:#45d1a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121830;--sf:#1b2347;--tx:#eceffb;--mu:#a2abcc;--ln:#323c6b;--pr:#8f9cff;--pt:#121830;--ok:#45d1a8;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.1;font-weight:800}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--ln)}
.bar{max-width:1080px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;margin-right:auto;cursor:pointer}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600}
nav button[aria-current=true]{background:var(--pr);color:var(--pt)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
.hero{padding:28px 0 18px}
.hero h1{font-size:clamp(34px,7vw,64px);max-width:14ch;letter-spacing:-.02em}
.hero p{color:var(--mu);max-width:46ch;margin:12px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.tools input{flex:1 1 220px;padding:11px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;cursor:pointer;font-weight:600}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.card:hover{border-color:var(--pr)}
.cv{height:120px;display:flex;align-items:flex-end;padding:12px;font-size:44px;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 55%))}
.cb{padding:14px}.cb h3{font-size:19px;margin:4px 0 6px}
.mu{color:var(--mu);font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--ln)}
.price{font-weight:800;margin-top:8px}
.btn{background:var(--pr);color:var(--pt);border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.btn.alt{background:none;color:var(--tx);border:1px solid var(--ln)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.tier{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.tier:last-of-type{border:0}.tier .i{flex:1}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);cursor:pointer;font-weight:800}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
.in{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.stat b{display:block;font-size:28px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
td input{width:110px;padding:6px 8px;border:1px solid var(--ln);border-radius:7px;background:var(--bg)}
.bargrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px}
.tk{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:16px;margin-bottom:16px;overflow:hidden;position:relative}
.tk .m{flex:1;padding:18px;min-width:0}
.tk .s{width:190px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-left:2px dashed var(--ln);background:var(--bg)}
.qr{background:#fff;padding:8px;border-radius:8px;width:calc(128px + 16px);height:calc(128px + 16px)}
.code{font:600 13px ui-monospace,monospace;letter-spacing:.08em}
@media(max-width:600px){.tk{flex-direction:column}.tk .s{width:auto;border-left:0;border-top:2px dashed var(--ln)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;z-index:9}
.empty{padding:40px 10px;text-align:center;color:var(--mu)}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:in .5s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<header><div class="bar">
<div class="logo" id="logo" tabindex="0">Pentas</div>
<nav aria-label="Menu utama">
<button data-v="home">Jelajah</button><button data-v="tix">Tiket Saya</button><button data-v="org">Organizer</button>
</nav></div></header>
<main id="app"></main>
<script>
const rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const tgl=d=>new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const KAT=['Musik','Teknologi','Kuliner','Olahraga','Seni'];
const E=[
{id:1,nama:'Synchronize Fest Mini',kat:'Musik',kota:'Jakarta',tgl:'2026-11-14',tempat:'Gambir Expo',h:20,t:[{n:'Reguler',h:250000,q:800,s:610},{n:'VIP',h:600000,q:100,s:92}],w:[40,62,55,80,95,70,110]},
{id:2,nama:'DevFest Jawa Timur',kat:'Teknologi',kota:'Surabaya',tgl:'2026-11-21',tempat:'Grand City Hall',h:210,t:[{n:'Umum',h:75000,q:500,s:240},{n:'Pelajar',h:35000,q:200,s:188}],w:[10,22,18,30,41,35,44]},
{id:3,nama:'Pasar Jajan Nusantara',kat:'Kuliner',kota:'Yogyakarta',tgl:'2026-12-05',tempat:'Alun-Alun Kidul',h:25,t:[{n:'Masuk',h:20000,q:2000,s:760}],w:[60,48,72,66,90,85,101]},
{id:4,nama:'Kediri Fun Run 10K',kat:'Olahraga',kota:'Kediri',tgl:'2026-11-29',tempat:'Simpang Lima Gumul',h:140,t:[{n:'5K',h:120000,q:400,s:312},{n:'10K',h:180000,q:300,s:205}],w:[22,30,27,45,51,38,60]},
{id:5,nama:'Pameran Seni Rupa Kini',kat:'Seni',kota:'Bandung',tgl:'2026-12-12',tempat:'Galeri Selasar',h:300,t:[{n:'Tiket Masuk',h:50000,q:600,s:150}],w:[5,9,12,8,16,14,20]},
{id:6,nama:'Jazz Gunung Bromo',kat:'Musik',kota:'Probolinggo',tgl:'2027-01-16',tempat:'Java Banana',h:170,t:[{n:'Festival',h:450000,q:900,s:530},{n:'Premium',h:900000,q:120,s:70}],w:[30,44,36,58,64,77,83]},
{id:7,nama:'AI Builders Meetup',kat:'Teknologi',kota:'Malang',tgl:'2026-11-08',tempat:'Atrium Mall',h:240,t:[{n:'Gratis',h:0,q:150,s:131}],w:[18,20,26,19,31,28,22]},
{id:8,nama:'Festival Kopi Tanah Jawa',kat:'Kuliner',kota:'Kediri',tgl:'2026-12-19',tempat:'Taman Brantas',h:35,t:[{n:'Tiket + Cangkir',h:65000,q:500,s:174}],w:[8,14,12,22,25,29,33]}];
const S={v:'home',cat:'Semua',q:'',sel:null,cart:{},step:0,tix:[],toast:'',nid:9};
const $=s=>document.querySelector(s),app=$('#app');
const sold=e=>e.t.reduce((a,x)=>a+x.s,0),quota=e=>e.t.reduce((a,x)=>a+x.q,0);
const minP=e=>Math.min(...e.t.map(x=>x.h));
const priceTx=e=>minP(e)?`Mulai ${rp(minP(e))}`:'Gratis';
const go=(v,sel=null)=>{S.v=v;S.sel=sel;S.cart={};S.step=0;render();scrollTo(0,0)};
function say(m){S.toast=m;render();setTimeout(()=>{S.toast='';const t=$('.toast');t&&t.remove()},2200)}
function home(){
 const l=E.filter(e=>(S.cat==='Semua'||e.kat===S.cat)&&(e.nama+e.kota).toLowerCase().includes(S.q.toLowerCase()));
 return `<section class="hero"><h1>Cari acara, pesan, langsung berangkat.</h1><p>Konser, meetup, lomba lari, dan festival kuliner. Tiket masuk ke ponselmu beserta kode QR.</p></section>
 <div class="tools"><input id="q" type="search" placeholder="Cari nama acara atau kota" value="${S.q}" aria-label="Cari acara"></div>
 <div class="chips" role="group" aria-label="Kategori">${['Semua',...KAT].map(k=>`<button class="chip" data-cat="${k}" aria-pressed="${S.cat===k}">${k}</button>`).join('')}</div>
 <div class="grid" style="margin-top:18px">${l.map(e=>`<button class="card" data-open="${e.id}"><div class="cv" style="--h:${e.h}">${e.nama[0]}</div><div class="cb"><span class="pill">${e.kat}</span><h3>${e.nama}</h3><div class="mu">${tgl(e.tgl)} · ${e.kota}</div><div class="price">${priceTx(e)}</div></div></button>`).join('')||'<div class="empty">Tidak ada acara yang cocok. Coba kata kunci atau kategori lain.</div>'}</div>`}
function detail(){
 const e=E.find(x=>x.id===S.sel),tot=Object.entries(S.cart).reduce((a,[i,n])=>a+n*e.t[i].h,0),n=Object.values(S.cart).reduce((a,b)=>a+b,0);
 const form=S.step===1?`<h3>Data pemesan</h3><label for="nm">Nama lengkap</label><input class="in" id="nm" autocomplete="name"><label for="em">Email</label><input class="in" id="em" type="email" autocomplete="email"><label for="py">Metode bayar</label><select class="in" id="py"><option>QRIS</option><option>Transfer Virtual Account</option><option>GoPay</option></select><p class="mu">Total ${rp(tot)} untuk ${n} tiket.</p><button class="btn" data-act="pay">Bayar sekarang</button> <button class="btn alt" data-act="back">Ubah pesanan</button>`:
 `<h3>Pilih tiket</h3>${e.t.map((x,i)=>{const left=x.q-x.s;return `<div class="tier"><div class="i"><b>${x.n}</b><div class="mu">${x.h?rp(x.h):'Gratis'} · ${left>0?`sisa ${left}`:'Habis'}</div></div><div class="qty"><button data-q="${i}" data-d="-1" aria-label="Kurangi ${x.n}">−</button><span aria-live="polite">${S.cart[i]||0}</span><button data-q="${i}" data-d="1" aria-label="Tambah ${x.n}" ${left<=0?'disabled':''}>+</button></div></div>`}).join('')}<p class="price">Total ${rp(tot)}</p><button class="btn" data-act="next" ${n?'':'disabled'}>Lanjut ke pembayaran</button>`;
 return `<button class="btn alt" data-v="home">‹ Semua acara</button><div class="two" style="margin-top:16px"><div><div class="cv" style="--h:${e.h};border-radius:14px;height:200px;font-size:80px">${e.nama[0]}</div><span class="pill" style="margin-top:14px">${e.kat}</span><h1 style="margin:8px 0;font-size:clamp(28px,5vw,44px)">${e.nama}</h1><p class="mu">${tgl(e.tgl)} · ${e.tempat}, ${e.kota}</p><p>Satu hari penuh bersama komunitas, penampil pilihan, dan area santai. Pintu dibuka dua jam sebelum acara dimulai. Bawa tiket QR dan kartu identitas.</p></div><div class="panel">${form}</div></div>`}
function tix(){
 if(!S.tix.length)return `<h2>Tiket Saya</h2><div class="empty">Belum ada tiket. <br><button class="btn" data-v="home" style="margin-top:12px">Cari acara</button></div>`;
 return `<h2 style="margin-bottom:16px">Tiket Saya</h2>`+S.tix.map((t,i)=>`<article class="tk"><div class="m"><span class="pill">${t.tier}</span><h3 style="margin:8px 0 4px;font-size:24px">${t.nama}</h3><div class="mu">${tgl(t.tgl)} · ${t.tempat}</div><p style="margin:12px 0 0"><b>${t.pemilik}</b><br><span class="mu">${t.email}</span></p></div><div class="s"><div class="qr" id="qr${i}"></div><div class="code">${t.kode}</div><span class="mu">Tunjukkan di pintu masuk</span></div></article>`).join('')}
function org(){
 const tot=E.reduce((a,e)=>a+e.t.reduce((b,x)=>b+x.s*x.h,0),0),ts=E.reduce((a,e)=>a+sold(e),0),tq=E.reduce((a,e)=>a+quota(e),0);
 const d=[0,1,2,3,4,5,6].map(i=>E.reduce((a,e)=>a+(e.w[i]||0),0)),mx=Math.max(...d),hari=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
 const chart=`<svg viewBox="0 0 420 180" role="img" aria-label="Tiket terjual per hari, 7 hari terakhir" style="width:100%;max-width:640px">${d.map((v,i)=>{const h=v/mx*130;return `<rect x="${14+i*58}" y="${150-h}" width="40" height="${h}" rx="5" fill="var(--pr)"/><text x="${34+i*58}" y="${143-h}" text-anchor="middle" font-size="12" fill="var(--tx)">${v}</text><text x="${34+i*58}" y="170" text-anchor="middle" font-size="12" fill="var(--mu)">${hari[i]}</text>`}).join('')}</svg>`;
 return `<h2>Dashboard Organizer</h2><div class="stats"><div class="panel stat"><span class="mu">Pendapatan kotor</span><b>${rp(tot)}</b></div><div class="panel stat"><span class="mu">Tiket terjual</span><b>${ts.toLocaleString('id-ID')}</b></div><div class="panel stat"><span class="mu">Terisi</span><b>${Math.round(ts/tq*100)}%</b></div><div class="panel stat"><span class="mu">Acara aktif</span><b>${E.length}</b></div></div>
 <div class="panel" style="margin-bottom:16px"><h3 style="margin-bottom:10px">Penjualan 7 hari terakhir</h3>${chart}</div>
 <div class="panel" style="margin-bottom:16px"><h3 style="margin-bottom:10px">Atur harga dan kuota</h3><div class="tw"><table><thead><tr><th>Acara</th><th>Jenis</th><th>Harga (Rp)</th><th>Kuota</th><th>Terjual</th></tr></thead><tbody>${E.flatMap(e=>e.t.map((x,i)=>`<tr><td>${i?'':e.nama}</td><td>${x.n}</td><td><input type="number" min="0" step="1000" value="${x.h}" data-e="${e.id}" data-i="${i}" data-f="h" aria-label="Harga ${e.nama} ${x.n}"></td><td><input type="number" min="${x.s}" value="${x.q}" data-e="${e.id}" data-i="${i}" data-f="q" aria-label="Kuota ${e.nama} ${x.n}"></td><td>${x.s}</td></tr>`)).join('')}</tbody></table></div></div>
 <div class="panel"><h3>Buat acara baru</h3><div class="bargrid"><div><label for="n1">Nama acara</label><input class="in" id="n1"></div><div><label for="n2">Kategori</label><select class="in" id="n2">${KAT.map(k=>`<option>${k}</option>`).join('')}</select></div><div><label for="n3">Kota</label><input class="in" id="n3"></div><div><label for="n4">Tanggal</label><input class="in" id="n4" type="date"></div><div><label for="n5">Harga tiket (Rp)</label><input class="in" id="n5" type="number" min="0" value="50000"></div><div><label for="n6">Kuota</label><input class="in" id="n6" type="number" min="1" value="200"></div></div><button class="btn" data-act="new" style="margin-top:14px">Terbitkan acara</button></div>`}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.v===S.v||(S.v==='detail'&&b.dataset.v==='home'))));
 const act=document.activeElement&&document.activeElement.id;
 app.innerHTML=({home,detail,tix,org}[S.v])()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
 if(S.v==='tix')S.tix.forEach((t,i)=>{const el=$('#qr'+i);if(window.QRCode)new QRCode(el,{text:t.kode,width:128,height:128});else el.textContent=t.kode});
 if(act&&$('#'+act)&&act==='q'){const q=$('#q');q.focus();q.setSelectionRange(99,99)}
}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('button,#logo');if(!t)return;const D=t.dataset;
 if(t.id==='logo')return go('home');
 if(D.v)return go(D.v);
 if(D.cat){S.cat=D.cat;return render()}
 if(D.open)return go('detail',+D.open);
 if(D.q!==undefined){const i=D.q,e=E.find(x=>x.id===S.sel),x=e.t[i],c=Math.max(0,Math.min((S.cart[i]||0)+ +D.d,Math.min(5,x.q-x.s)));c?S.cart[i]=c:delete S.cart[i];return render()}
 if(D.act==='next'){S.step=1;return render()}
 if(D.act==='back'){S.step=0;return render()}
 if(D.act==='pay'){const nm=$('#nm').value.trim(),em=$('#em').value.trim();
  if(!nm||!/\S+@\S+\.\S+/.test(em))return say('Isi nama dan email yang valid dulu.');
  const e=E.find(x=>x.id===S.sel);
  Object.entries(S.cart).forEach(([i,n])=>{e.t[i].s+=n;for(let k=0;k<n;k++)S.tix.unshift({nama:e.nama,tgl:e.tgl,tempat:e.tempat,tier:e.t[i].n,pemilik:nm,email:em,kode:'PNT-'+Math.random().toString(36).slice(2,8).toUpperCase()})});
  go('tix');return say('Pembayaran berhasil. Tiket sudah masuk.')}
 if(D.act==='new'){const v=i=>$('#n'+i).value.trim();
  if(!v(1)||!v(3)||!v(4))return say('Nama, kota, dan tanggal wajib diisi.');
  E.unshift({id:S.nid++,nama:v(1),kat:v(2),kota:v(3),tgl:v(4),tempat:'Lokasi menyusul',h:Math.floor(Math.random()*360),t:[{n:'Reguler',h:+v(5)||0,q:+v(6)||1,s:0}],w:[0,0,0,0,0,0,0]});
  render();return say('Acara diterbitkan.')}
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='q'){S.q=ev.target.value;render()}
});
document.addEventListener('change',ev=>{const d=ev.target.dataset;
 if(d.f){const x=E.find(e=>e.id==d.e).t[d.i];let v=Math.max(0,+ev.target.value||0);if(d.f==='q')v=Math.max(v,x.s);x[d.f]=v;render();say('Perubahan disimpan.')}});
render();
</script>
</body>
</html>
